[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "steel-ball-detection"
version = "0.1.0"
description = "Interactive contour-based steel ball detection prototype"
requires-python = ">=3.10"
dependencies = ["opencv-python>=4,<5", "numpy>=1.23,<3"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
steel-ball-detect = "steel_ball_detection.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
